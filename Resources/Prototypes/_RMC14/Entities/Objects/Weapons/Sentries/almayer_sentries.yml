- type: entity
  parent: RMCBaseTurret
  id: RMCTurretAlmayer
  name: ОН 635С статична вартова турель
  description: Повністю автономна оборонна турель, що здатна вкрай ефективно знищувати ворогів на близько-середній дистанції. Оснащена модифікованою автогарматою М32-С та внутрішнім майже нескінченим запасом амуніції.
  components:
  - type: InteractionPopup
    interactDelay: 0.2
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Effects/double_beep.ogg
  - type: Corrodible
    isCorrodible: false
  - type: Gun
    fireRate: 2.5
  - type: BallisticAmmoProvider
    cycleable: false
    proto: RMCCartridgeSentry
    capacity: 99999
  - type: NpcFactionMember
    factions:
    - UNMC
  - type: MarineIFF
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: HTN
    rootTask:
      task: RMCTurretCompound
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
      VisionRadius: !type:Single
        5.5
      AggroVisionRadius: !type:Single
        5.5
  - type: UserIFF
    factions:
    - FactionMarine
  - type: RMCHealthExaminable
    speciesType: Mechanical
  # Mriya start. Повернення колізії для плювків
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      sentry:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 20
        layer:
        - MidImpassable
        - BulletImpassable
        mask:
        - MidImpassable
        - BulletImpassable
        hard: false
  # Mriya end

- type: entity
  parent: BaseStructure
  id: RMCDeployerSentry
  name: система розгортання турелі
  description: Бокс, який дозволяє розгорнути вартову турель за потреби.
  components:
  - type: Transform
    anchored: true
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Structures/Machines/sentry_deployer.rsi
    layers:
    - state: floor_sentry_installed
      map: [ "enum.EquipmentDeployState.UnDeployed" ]
    - state: floor_sentry_deployed
      map: [ "enum.EquipmentDeployState.Deployed" ]
      visible: false
  - type: RMCEquipmentDeployer
    deployPrototype: RMCTurretAlmayer
    isDeployableByHand: true
    isDeployable: true
    alertLevelRequired: Red
    blacklist:
      components:
      - Xeno
  - type: InteractionOutline
