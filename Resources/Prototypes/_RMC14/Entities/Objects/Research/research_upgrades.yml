# Sleeper Upgrades
- type: entity
  parent: RMCResearchUpgradeBase
  id: RMCResearchUpgradeSleeper
  name: дослідницьке оновлення (сліпер)
  description: Дослідницьке оновлення для сліпер системи. Технологія на цьому диску дозволить системі вводити ширший спектр хімічних речовин та покращує роботу діалізного апарату. Вставте цей диск в консоль сліпера, щоб задіяти оновлення. Після встановлення оновлення неможливо деактивувати чи застосувати до іншого обладнання.
